<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSA Control Centre — Manage Students & Roles</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #070B12;
      --bg-secondary: #0D1322;
      --bg-card: rgba(16, 24, 40, 0.75);
      --bg-card-hover: rgba(22, 33, 56, 0.9);
      --border-subtle: rgba(99, 140, 255, 0.15);
      --border-focus: rgba(99, 140, 255, 0.45);
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --accent-gradient: linear-gradient(135deg, #6366F1 0%, #38BDF8 100%);
      --accent-purple: #8B5CF6;
      --accent-cyan: #38BDF8;
      --accent-emerald: #10B981;
      --accent-amber: #F59E0B;
      --accent-rose: #F43F5E;
      --radius-xl: 18px;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 6px;
      --font-display: 'Outfit', sans-serif;
      --font-sans: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* Ambient background lighting */
    .ambient-glow {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 1100px;
      height: 500px;
      background: radial-gradient(ellipse at center, rgba(99, 102, 241, 0.18) 0%, rgba(56, 189, 248, 0.06) 50%, transparent 80%);
      pointer-events: none;
      z-index: 0;
    }

    /* Header Nav */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(7, 11, 18, 0.88);
      border-bottom: 1px solid var(--border-subtle);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }

    .brand-logo svg {
      width: 22px;
      height: 22px;
      fill: #fff;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #FFF 60%, #94A3B8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid transparent;
      outline: none;
    }

    .btn-primary {
      background: var(--accent-gradient);
      color: #FFF;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border-subtle);
      color: var(--text-primary);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--border-focus);
    }

    .btn-promote {
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34D399;
    }
    .btn-promote:hover {
      background: rgba(16, 185, 129, 0.25);
      border-color: #34D399;
      transform: translateY(-1px);
    }

    .btn-demote {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: #FB7185;
    }
    .btn-demote:hover {
      background: rgba(244, 63, 94, 0.22);
      border-color: #FB7185;
      transform: translateY(-1px);
    }

    /* Main Container */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 24px 60px 24px;
      position: relative;
      z-index: 1;
    }

    /* Overview Header Card */
    .hero-card {
      background: linear-gradient(135deg, rgba(16, 24, 40, 0.85) 0%, rgba(13, 19, 34, 0.95) 100%);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 24px 28px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 700;
      color: #FFF;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hero-subtitle {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-top: 6px;
      max-width: 520px;
    }

    /* Mini Stat Badges */
    .kpi-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .kpi-mini-card {
      background: rgba(7, 11, 18, 0.7);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px 18px;
      min-width: 120px;
      text-align: center;
    }

    .kpi-mini-val {
      font-size: 1.5rem;
      font-weight: 700;
      color: #FFF;
      font-family: var(--font-display);
    }

    .kpi-mini-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-top: 2px;
    }

    /* Toolbar Panel */
    .toolbar-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 280px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: rgba(7, 11, 18, 0.8);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px 16px;
      font-size: 0.9rem;
      color: var(--text-primary);
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }

    .filter-chips {
      display: flex;
      background: rgba(7, 11, 18, 0.8);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 4px;
      gap: 4px;
    }

    .filter-chip {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-chip:hover {
      color: #FFF;
    }
    .filter-chip.active {
      background: rgba(99, 102, 241, 0.25);
      color: #A5B4FC;
      border: 1px solid rgba(99, 102, 241, 0.4);
    }

    .sort-select {
      background: rgba(7, 11, 18, 0.8);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 9px 14px;
      font-size: 0.85rem;
      color: var(--text-primary);
      outline: none;
      cursor: pointer;
    }

    /* User Cards List */
    .user-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .user-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      transition: all 0.2s ease;
    }
    .user-card:hover {
      background: var(--bg-card-hover);
      border-color: rgba(99, 140, 255, 0.3);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .user-info-group {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
    }

    .user-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.15rem;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid var(--border-subtle);
      color: #FFF;
    }
    .user-avatar.owner {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.25), rgba(217, 119, 6, 0.15));
      border-color: var(--accent-amber);
      color: var(--accent-amber);
    }
    .user-avatar.teacher {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(5, 150, 105, 0.15));
      border-color: var(--accent-emerald);
      color: var(--accent-emerald);
    }
    .user-avatar.student {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(99, 102, 241, 0.15));
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .user-details {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .user-name-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-name {
      font-weight: 700;
      font-size: 1.05rem;
      color: #FFF;
    }

    .role-badge {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .role-badge.owner {
      background: rgba(245, 158, 11, 0.15);
      color: #FBBF24;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .role-badge.teacher {
      background: rgba(16, 185, 129, 0.15);
      color: #34D399;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .role-badge.student {
      background: rgba(56, 189, 248, 0.15);
      color: #38BDF8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .user-email {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .user-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .user-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Modal / Drawer */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-card {
      background: #0D1424;
      border: 1px solid var(--border-focus);
      border-radius: var(--radius-xl);
      max-width: 680px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 16px;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: #1E293B;
      border: 1px solid var(--accent-emerald);
      color: #FFF;
      padding: 12px 20px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 200;
      transition: all 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <!-- Header -->
  <header>
    <div class="brand-group">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l-10-5v9l10 5 10-5v-9l-10 5z"/></svg>
      </div>
      <div>
        <div class="brand-title">DSA Control Centre</div>
        <div class="brand-subtitle">Manage Students & Staff Roles</div>
      </div>
    </div>

    <div class="header-actions">
      <button class="btn btn-secondary" onclick="fetchUsers()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        Refresh
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <!-- Hero Summary Section matching Android app -->
    <div class="hero-card">
      <div>
        <div class="hero-title">
          <span>👥 Manage Students & Instructors</span>
        </div>
        <div class="hero-subtitle">
          Promote students to teachers with one click, demote staff, and check detailed student progress.
        </div>
      </div>

      <div class="kpi-row">
        <div class="kpi-mini-card">
          <div class="kpi-mini-val" id="stat-total-users">--</div>
          <div class="kpi-mini-label">Total Users</div>
        </div>
        <div class="kpi-mini-card">
          <div class="kpi-mini-val" id="stat-teachers" style="color: var(--accent-emerald);">--</div>
          <div class="kpi-mini-label">Teachers</div>
        </div>
        <div class="kpi-mini-card">
          <div class="kpi-mini-val" id="stat-students" style="color: var(--accent-cyan);">--</div>
          <div class="kpi-mini-label">Students</div>
        </div>
      </div>
    </div>

    <!-- Toolbar: Search, Filters & Sorting -->
    <div class="toolbar-panel">
      <div class="search-box">
        <input type="text" id="search-input" class="search-input" placeholder="🔍 Search student by name or email address..." oninput="applyFilters()" />
      </div>

      <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
        <div class="filter-chips">
          <button class="filter-chip active" id="chip-all" onclick="setFilter('all')">All (<span id="count-all">0</span>)</button>
          <button class="filter-chip" id="chip-student" onclick="setFilter('student')">🎓 Students (<span id="count-students">0</span>)</button>
          <button class="filter-chip" id="chip-teacher" onclick="setFilter('teacher')">🧑‍🏫 Teachers (<span id="count-teachers">0</span>)</button>
        </div>

        <select id="sort-select" class="sort-select" onchange="applyFilters()">
          <option value="name_asc">Sort: Name (A-Z)</option>
          <option value="name_desc">Sort: Name (Z-A)</option>
          <option value="role">Sort: By Role</option>
          <option value="recent">Sort: Recently Active</option>
          <option value="newest">Sort: Newest Joined</option>
        </select>
      </div>
    </div>

    <!-- Users List Container -->
    <div class="user-list" id="users-list">
      <div style="text-align: center; padding: 50px; color: var(--text-muted);">
        Loading accounts...
      </div>
    </div>
  </main>

  <!-- Progress Detail Modal -->
  <div id="progress-modal" class="modal-overlay" style="display: none;" onclick="closeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div>
          <h2 id="modal-user-name" style="font-size: 1.3rem; font-weight: 700; color: #FFF;">Student Progress</h2>
          <div id="modal-user-email" style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 2px;"></div>
        </div>
        <button class="btn btn-secondary" style="padding: 4px 10px;" onclick="closeModal()">✕</button>
      </div>

      <div id="modal-content-body">
        <div style="text-align: center; padding: 30px; color: var(--text-muted);">Fetching activity...</div>
      </div>
    </div>
  </div>

  <!-- Toast Element -->
  <div id="toast"></div>

  <script>
    let allUsers = [];
    let currentFilter = 'all';
    let pendingUserId = '';

    window.addEventListener('DOMContentLoaded', () => {
      fetchUsers();
    });

    async function fetchUsers() {
      const container = document.getElementById('users-list');
      container.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-muted);">Loading accounts...</div>';

      try {
        const res = await fetch('/api/users', {
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer owner'
          }
        });
        const json = await res.json();
        allUsers = (json.data && json.data.users) || json.users || [];
        updateSummaryStats();
        applyFilters();
      } catch (err) {
        console.error('Failed to load users', err);
        container.innerHTML = `
          <div style="text-align: center; padding: 40px; color: var(--accent-rose);">
            <div style="font-weight: 600;">Failed to load users</div>
            <button class="btn btn-secondary" style="margin-top: 12px;" onclick="fetchUsers()">Retry</button>
          </div>
        `;
      }
    }

    function updateSummaryStats() {
      const total = allUsers.length;
      const teachers = allUsers.filter(u => u.role === 'teacher').length;
      const students = allUsers.filter(u => u.role === 'student' || !u.role).length;

      document.getElementById('stat-total-users').textContent = total;
      document.getElementById('stat-teachers').textContent = teachers;
      document.getElementById('stat-students').textContent = students;

      document.getElementById('count-all').textContent = total;
      document.getElementById('count-teachers').textContent = teachers;
      document.getElementById('count-students').textContent = students;
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('chip-' + filter);
      if (activeBtn) activeBtn.classList.add('active');
      applyFilters();
    }

    function applyFilters() {
      const query = (document.getElementById('search-input')?.value || '').toLowerCase().trim();
      const sort = document.getElementById('sort-select')?.value || 'name_asc';

      let filtered = allUsers.filter(u => {
        const name = (u.displayName || u.name || '').toLowerCase();
        const email = (u.email || '').toLowerCase();
        const matchQuery = !query || name.includes(query) || email.includes(query);

        if (!matchQuery) return false;

        if (currentFilter === 'teacher') return u.role === 'teacher';
        if (currentFilter === 'student') return u.role === 'student' || !u.role;
        return true;
      });

      // Sorting
      filtered.sort((a, b) => {
        const nameA = (a.displayName || a.name || a.email || '').toLowerCase();
        const nameB = (b.displayName || b.name || b.email || '').toLowerCase();

        if (sort === 'name_asc') return nameA.localeCompare(nameB);
        if (sort === 'name_desc') return nameB.localeCompare(nameA);
        if (sort === 'role') return (a.role || '').localeCompare(b.role || '');
        if (sort === 'newest') return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
        if (sort === 'recent') return new Date(b.lastSeenAt || 0) - new Date(a.lastSeenAt || 0);
        return 0;
      });

      renderUsers(filtered);
    }

    function renderUsers(users) {
      const container = document.getElementById('users-list');
      container.innerHTML = '';

      if (users.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 50px; background: var(--bg-card); border-radius: var(--radius-lg); border: 1px dashed var(--border-subtle); color: var(--text-muted);">
            No matching accounts found.
          </div>
        `;
        return;
      }

      users.forEach(u => {
        const name = u.displayName || u.name || 'Anonymous Scholar';
        const initial = name.charAt(0).toUpperCase() || 'U';
        const role = (u.role || 'student').toLowerCase();
        const isOwner = role === 'owner';
        const isTeacher = role === 'teacher';
        const isStudent = !isOwner && !isTeacher;
        const isPending = pendingUserId === u.id;

        const card = document.createElement('div');
        card.className = 'user-card';

        // Format dates
        const joinedDate = u.createdAt ? new Date(u.createdAt).toLocaleDateString() : 'Unknown';
        const lastSeen = u.lastSeenAt ? new Date(u.lastSeenAt).toLocaleString() : 'Recently';

        // Role badge text
        let roleBadgeHtml = '';
        if (isOwner) {
          roleBadgeHtml = '<span class="role-badge owner">👑 Platform Owner</span>';
        } else if (isTeacher) {
          roleBadgeHtml = '<span class="role-badge teacher">🧑‍🏫 Instructor / Teacher</span>';
        } else {
          roleBadgeHtml = '<span class="role-badge student">🎓 Student</span>';
        }

        // Action button
        let actionBtnHtml = '';
        if (isOwner) {
          actionBtnHtml = `<span style="color: var(--text-muted); font-size: 0.8rem; font-style: italic; padding: 6px 12px;">Protected Administrator</span>`;
        } else if (isStudent) {
          actionBtnHtml = `
            <button class="btn btn-promote" ${isPending ? 'disabled' : ''} onclick="toggleRole('${u.id}', 'teacher', '${encodeURIComponent(name)}')">
              ${isPending ? 'Updating...' : 'Make Teacher 🧑‍🏫'}
            </button>
          `;
        } else if (isTeacher) {
          actionBtnHtml = `
            <button class="btn btn-demote" ${isPending ? 'disabled' : ''} onclick="toggleRole('${u.id}', 'student', '${encodeURIComponent(name)}')">
              ${isPending ? 'Updating...' : 'Demote to Student 🎓'}
            </button>
          `;
        }

        card.innerHTML = `
          <div class="user-info-group">
            <div class="user-avatar ${role}">${initial}</div>
            <div class="user-details">
              <div class="user-name-row">
                <span class="user-name">${name}</span>
                ${roleBadgeHtml}
              </div>
              <span class="user-email">${u.email || 'No email associated'}</span>
              <span class="user-meta">Joined: ${joinedDate} • Last Active: ${lastSeen}</span>
            </div>
          </div>

          <div class="user-actions">
            ${actionBtnHtml}
            <button class="btn btn-secondary" onclick="openStudentProgress('${u.id}', '${encodeURIComponent(name)}', '${encodeURIComponent(u.email || '')}')">
              Progress 📊
            </button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    async function toggleRole(userId, newRole, encodedName) {
      const name = decodeURIComponent(encodedName);
      pendingUserId = userId;
      applyFilters();

      try {
        const res = await fetch(`/api/users/${userId}/role`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer owner'
          },
          body: JSON.stringify({ newRole })
        });

        if (!res.ok) throw new Error('Role update failed');

        // Update local user state
        const target = allUsers.find(u => u.id === userId);
        if (target) {
          target.role = newRole;
        }

        updateSummaryStats();
        pendingUserId = '';
        applyFilters();

        showToast(
          newRole === 'teacher'
            ? `🎉 ${name} has been promoted to Teacher!`
            : `ℹ️ ${name} is now a Student.`
        );
      } catch (err) {
        console.error('Role update error', err);
        pendingUserId = '';
        applyFilters();
        showToast('⚠️ Could not update user role. Try again.');
      }
    }

    async function openStudentProgress(userId, encodedName, encodedEmail) {
      const name = decodeURIComponent(encodedName);
      const email = decodeURIComponent(encodedEmail);

      document.getElementById('modal-user-name').textContent = name;
      document.getElementById('modal-user-email').textContent = email;
      const modal = document.getElementById('progress-modal');
      const body = document.getElementById('modal-content-body');
      modal.style.display = 'flex';
      body.innerHTML = '<div style="text-align: center; padding: 30px; color: var(--text-muted);">Fetching student learning history...</div>';

      try {
        const res = await fetch(`/api/admin/users/${userId}/detail`, {
          headers: {
            'Authorization': 'Bearer owner'
          }
        });
        const json = await res.json();
        const data = json.data || json;
        const practiceSessions = data.practiceSessions || [];
        const progressEntries = data.progressEntries || [];
        const feedbackEntries = data.feedbackEntries || [];

        let sessionsHtml = '';
        if (practiceSessions.length > 0) {
          sessionsHtml = practiceSessions.map(s => `
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: rgba(255,255,255,0.03); border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border-subtle);">
              <div>
                <span style="font-weight: 600; color: #FFF;">${(s.techniqueId || 'Algorithm').replace(/_/g, ' ').toUpperCase()}</span>
                <span style="font-size: 0.75rem; color: var(--text-muted); display: block;">${new Date(s.createdAt).toLocaleString()}</span>
              </div>
              <div style="font-family: var(--font-mono); font-weight: 700; color: var(--accent-emerald);">Score: ${s.score || 0}</div>
            </div>
          `).join('');
        } else {
          sessionsHtml = '<div style="color: var(--text-muted); font-size: 0.9rem; padding: 12px 0;">No algorithm practice runs recorded yet.</div>';
        }

        body.innerHTML = `
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px;">
            <div class="kpi-mini-card" style="text-align: left; background: rgba(255,255,255,0.03);">
              <div class="kpi-mini-val" style="color: var(--accent-cyan); font-size: 1.3rem;">${practiceSessions.length}</div>
              <div class="kpi-mini-label">Practice Sessions</div>
            </div>
            <div class="kpi-mini-card" style="text-align: left; background: rgba(255,255,255,0.03);">
              <div class="kpi-mini-val" style="color: var(--accent-emerald); font-size: 1.3rem;">${progressEntries.length}</div>
              <div class="kpi-mini-label">Completed Milestones</div>
            </div>
          </div>

          <h3 style="font-size: 0.95rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px;">Recent Practice Attempts</h3>
          <div style="max-height: 260px; overflow-y: auto;">
            ${sessionsHtml}
          </div>
        `;
      } catch (err) {
        body.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 20px;">Could not load extended student history.</div>';
      }
    }

    function closeModal(event) {
      if (!event || event.target === document.getElementById('progress-modal')) {
        document.getElementById('progress-modal').style.display = 'none';
      }
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.style.display = 'flex';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 3500);
    }
  </script>
</body>
</html>
